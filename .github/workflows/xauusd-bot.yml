name: XAU/USD Alert Bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "once = normal alert check · test-telegram = send one confirmation message to verify delivery"
        type: choice
        default: "once"
        options:
          - once
          - test-telegram

permissions:
  contents: write

concurrency:
  group: xauusd-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore news calendar cache
        uses: actions/cache@v4
        with:
          path: calendar.json
          key: xauusd-calendar-${{ github.run_id }}
          restore-keys: xauusd-calendar-

      - name: Run bot (single pass)
        env:
          OANDA_TOKEN: ${{ secrets.OANDA_TOKEN }}
          OANDA_ENV: ${{ secrets.OANDA_ENV }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CAPITAL: ${{ secrets.CAPITAL }}
          RISK_PCT: ${{ secrets.RISK_PCT }}
        run: python bot_xauusd.py --${{ inputs.mode || 'once' }}

      - name: Persist trade journal
        run: |
          if [ -n "$(git status --porcelain journal.csv 2>/dev/null)" ]; then
            git config user.name "xauusd-bot"
            git config user.email "actions@users.noreply.github.com"
            git add journal.csv
            git commit -m "journal: auto-update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          else
            echo "No journal changes to commit."
          fi
